spring.application.name=sicaps-backend
server.port=${PORT:8080}

# PostgreSQL Configuration (Configurable via DB_URL or DATABASE_URL)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/sicaps_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# HikariCP Connection Pool Optimization for Render & Neon Serverless
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=900000

# Embedded Tomcat Optimization for Cloud Containers (<512MB RAM)
server.tomcat.threads.max=15
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
server.tomcat.accept-count=10

# Security user defaults
spring.security.user.name=admin
spring.security.user.password=admin
