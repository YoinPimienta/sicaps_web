spring.application.name=sicaps-backend
server.port=${PORT:8080}

# PostgreSQL Configuration (Configurable via DB_URL or DATABASE_URL)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/sicaps_db}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Performance Optimization
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# HikariCP Connection Pool Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Security user defaults
spring.security.user.name=admin
spring.security.user.password=admin
