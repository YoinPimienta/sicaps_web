version: '3.8'

services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: sicaps_db
    restart: always
    environment:
      POSTGRES_DB: sicaps_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Backend: API Java Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sicaps_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/sicaps_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgrespassword
    depends_on:
      - db

  # Frontend: PHP Laravel
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sicaps_frontend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/var/www
    # En desarrollo usaremos el script start.sh para auto-configurar Laravel
    command: /bin/bash /var/www/start.sh
    depends_on:
      - backend

volumes:
  db_data:
